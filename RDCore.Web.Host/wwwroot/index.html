<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RDCore.Web</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 1rem; }
    pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>RDCore.Web</h1>
  <p>This page calls <code>GET /api/hello/{name}</code>, an endpoint that an RD-VBA procedure declares with <code>'@HttpGet("hello/{name}")</code>
    in a module annotated <code>'@Controller("api")</code>, and shows its answer.</p>
  <form id="hello" data-endpoint="api/hello/">
    <label for="name">Name</label>
    <input id="name" name="name" value="World" required>
    <button type="submit">Call</button>
  </form>
  <pre id="answer"></pre>
  <script src="app.js"></script>
</body>
</html>
